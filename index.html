<!doctype html>
<html lang="fr-CA">
<head>
<title>KFI'S</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="KFI'S — gestion financière de Khalil et Yousra">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KFI'S">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.KFIS_STANDALONE=true;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Mise en page : barre latérale fixe + colonne de travail ; sur téléphone, barre supérieure, tiroir de navigation et bouton d'ajout flottant. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#E1E6E4; --line-2:#EDF1EF;
  --ink:#15201C; --ink-2:#4B5954; --ink-3:#7E8B86;
  --accent:#1B5A4A; --accent-ink:#FFFFFF; --accent-soft:#E2EEE9;
  --khalil:#33589A; --khalil-soft:#E5ECF7; --yousra:#A1436C; --yousra-soft:#F6E6EE;
  --pos:#1D7A51; --warn:#A8720F; --near:#C0571A; --neg:#B32D3A; --warn-soft:#FBF1DC; --near-soft:#FCE9DD; --neg-soft:#FBE4E6; --pos-soft:#E0F2E9;
  --c-income:#1B5A4A; --c-exp:#8392A8; --c-sav:#C1952F;
  --shadow:0 1px 2px rgba(20,32,28,.05),0 4px 16px rgba(20,32,28,.04);
  --f-ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Instrument Serif',ui-serif,Georgia,'Times New Roman',serif;
  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2320; --line:#26312D; --line-2:#1F2925;
  --ink:#E7EDEA; --ink-2:#A8B5AF; --ink-3:#74827C;
  --accent:#5DB298; --accent-ink:#0B1A15; --accent-soft:#1B3029;
  --khalil:#82A6E2; --khalil-soft:#1D2738; --yousra:#E38DB3; --yousra-soft:#352030;
  --pos:#4DC48B; --warn:#E3AA4A; --near:#EF8B4F; --neg:#F06C77; --warn-soft:#33291A; --near-soft:#36231A; --neg-soft:#381E22; --pos-soft:#17302A;
  --c-income:#5DB298; --c-exp:#8E9DB4; --c-sav:#DDB45B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2320; --line:#26312D; --line-2:#1F2925;
  --ink:#E7EDEA; --ink-2:#A8B5AF; --ink-3:#74827C;
  --accent:#5DB298; --accent-ink:#0B1A15; --accent-soft:#1B3029;
  --khalil:#82A6E2; --khalil-soft:#1D2738; --yousra:#E38DB3; --yousra-soft:#352030;
  --pos:#4DC48B; --warn:#E3AA4A; --near:#EF8B4F; --neg:#F06C77; --warn-soft:#33291A; --near-soft:#36231A; --neg-soft:#381E22; --pos-soft:#17302A;
  --c-income:#5DB298; --c-exp:#8E9DB4; --c-sav:#DDB45B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
:root[data-person="yousra"]{
  --bg:#FBF1F5; --surface:#FFFFFF; --surface-2:#FDF6F9; --line:#F0D9E3; --line-2:#F6E7ED;
  --ink:#2A1520; --ink-2:#6B4A59; --ink-3:#A07D8C;
  --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#FADDE9;
  --khalil:#33589A; --khalil-soft:#E5ECF7; --yousra:#C2185B; --yousra-soft:#FADDE9;
  --pos:#1D7A51; --warn:#A8720F; --near:#C0571A; --neg:#B32D3A; --warn-soft:#FBF1DC; --near-soft:#FCE9DD; --neg-soft:#FBE4E6; --pos-soft:#E0F2E9;
  --c-income:#C2185B; --c-exp:#A9939E; --c-sav:#E39A3B;
  --shadow:0 1px 2px rgba(120,20,60,.06),0 4px 16px rgba(120,20,60,.05); color-scheme:light}
:root[data-person="khalil"]{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1B1B1E; --line:#2A2A2E; --line-2:#202024;
  --ink:#F2F2F3; --ink-2:#B4B4BA; --ink-3:#7C7C84;
  --accent:#F2F2F3; --accent-ink:#0A0A0B; --accent-soft:#26262A;
  --khalil:#8FB0EA; --khalil-soft:#1C2433; --yousra:#E38DB3; --yousra-soft:#33202A;
  --pos:#4DC48B; --warn:#E3AA4A; --near:#EF8B4F; --neg:#F06C77; --warn-soft:#2E2618; --near-soft:#32221A; --neg-soft:#341C20; --pos-soft:#15291F;
  --c-income:#F2F2F3; --c-exp:#6E6E78; --c-sav:#D9B45A;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);transition:background-color .3s ease}
body{color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tn{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
/* ---------- Barre latérale ---------- */
.side{position:fixed;inset:0 auto 0 0;width:244px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.mono{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num);font-size:19px;letter-spacing:-.5px}
.brand b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line-2);display:grid;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.main{flex:1;min-width:0;margin-left:244px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:13px}
.top .grow{flex:1;min-width:0}
.menu-btn{display:none}
.view{max-width:1240px;margin:0 auto;padding-block:8px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .grow{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi .k-l{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .k-v{font-family:var(--f-num);font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);position:relative;overflow:hidden}
.hero .k-l,.hero .k-s{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
.hero .k-v{font-size:52px}
.hero .break{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px}
.hero .break span b{font-weight:600}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent-ink) 18%,transparent);box-shadow:0 0 0 30px color-mix(in srgb,var(--accent-ink) 4%,transparent),0 0 0 62px color-mix(in srgb,var(--accent-ink) 3%,transparent);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.pill.watch{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.near{background:var(--near-soft);color:var(--near);border-color:transparent}
.pill.over,.pill.neg{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.pill.k{background:var(--khalil-soft);color:var(--khalil);border-color:transparent}
.pill.y{background:var(--yousra-soft);color:var(--yousra);border-color:transparent}
.pill.c{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.demo{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3);font-weight:500}
.hero .pill{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:var(--accent-ink);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.bar.watch i{background:var(--warn)}.bar.near i{background:var(--near)}.bar.over i{background:var(--neg)}
.bar .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.split{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line-2);margin-top:10px}
.split i{display:block;height:100%}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line-2);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface-2)}
.row.cancelled .t,.row.cancelled .amt{text-decoration:line-through;color:var(--ink-3)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.ico svg{width:17px;height:17px;stroke:currentColor}
.ico.in{background:var(--pos-soft);color:var(--pos)}
.ico.sv{background:var(--warn-soft);color:var(--warn)}
.ico.tr{background:var(--khalil-soft);color:var(--khalil)}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:16px 2px 4px}
.empty{text-align:center;padding:28px 12px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.table-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--neg)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.search{position:relative;min-width:200px;flex:1}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.search .inp{padding-left:34px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.k.on{background:var(--khalil);border-color:var(--khalil);color:#fff}
.chip.y.on{background:var(--yousra);border-color:var(--yousra);color:#fff}
.amount-inp{font-family:var(--f-num);font-size:40px;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0;background:transparent;width:100%;font-variant-numeric:tabular-nums}
.amount-inp:focus{outline:none;border-color:var(--accent)}
.banner{border-radius:12px;padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft)}
.banner .grow{flex:1;min-width:200px}
.banner svg{width:18px;height:18px;flex:none;stroke:currentColor}
.pill svg{width:12px;height:12px;flex:none;stroke:currentColor}
.g-side,.g-hero{align-items:start}
/* ---------- Modale ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .2s ease;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.modal-h h3{margin:0;font-size:17px;flex:1}
.modal-b{padding:6px 18px 18px;display:grid;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.modal-f .grow{flex:1}
details.more summary{cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
details.more[open] summary{margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.fab{display:none}
.smart{padding:14px 14px 12px;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.smart-row{display:flex;gap:10px;align-items:flex-start}
.smart-ico{margin-top:3px}
.smart-in{flex:1;min-width:0;resize:none;border:0;background:transparent;font-size:17px;line-height:1.4;padding:8px 2px;color:var(--ink);font-family:var(--f-ui);overflow:hidden}
.smart-in:focus{outline:none}
.smart-in::placeholder{color:var(--ink-3)}
.smart-row:focus-within .smart-ico{background:var(--accent);color:var(--accent-ink)}
#smart-prev{margin-top:6px}
.smart-ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.smart-ex .chip{font-size:12.5px;padding:4px 10px}
.smart-item{border-top:1px solid var(--line-2);align-items:flex-start}
.smart-item.bad .t{color:var(--ink-3)}
.smart-list .chips .pill{font-weight:500}
.smart-cam{padding:8px 11px}
.smart-cam span{display:inline}
@media (max-width:640px){.smart-cam span{display:none}}
.receipt-box{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px}
.receipt-box img{width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.receipt-box svg{width:16px;height:16px;stroke:currentColor}
.receipt-wait{display:grid;justify-items:center;gap:10px;padding:26px 8px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.toast-undo{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;margin-left:10px;padding:0}

<script>/*
 * KHALIL & YOUSRA FINANCE — moteur de calcul financier
 * ----------------------------------------------------
 * Toutes les sommes sont des ENTIERS EN CENTS. Aucun nombre flottant n'est
 * utilisé pour l'argent. Toutes les dates sont des chaînes 'AAAA-MM-JJ'
 * (dates civiles, sans fuseau), converties en numéros de jour UTC pour les
 * calculs : pas de surprise d'heure avancée.
 *
 * Ce module est pur (aucun accès réseau, DOM ou base de données) : il est
 * utilisé tel quel par l'application et par les tests automatisés.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.KYF = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ======================= ARGENT (cents entiers) ======================= */

  function assertCents(n, label) {
    if (!Number.isSafeInteger(n)) throw new TypeError((label || 'montant') + ' doit être un entier en cents');
    return n;
  }

  /** Division entière arrondie au plus proche (demi -> s'éloigne de zéro). */
  function divRound(a, b) {
    assertCents(a, 'numérateur'); assertCents(b, 'dénominateur');
    if (b === 0) throw new RangeError('division par zéro');
    const neg = (a < 0) !== (b < 0);
    const A = Math.abs(a), B = Math.abs(b);
    const q = Math.floor(A / B), r = A - q * B;
    const res = (2 * r >= B) ? q + 1 : q;
    return neg ? -res : res;
  }

  /** Applique un pourcentage exprimé en points de base (1 % = 100 pb). */
  function mulBps(cents, bps) { return divRound(cents * bps, 10000); }

  /** "1 234,56", "1234.5", "12 $", "-3,1" -> cents (entier). null si invalide. */
  function parseMoney(input) {
    if (typeof input === 'number') {
      if (!Number.isFinite(input)) return null;
      input = String(input);
    }
    if (typeof input !== 'string') return null;
    let s = input.replace(/[\s  $]/g, '').replace(/CAD/i, '');
    if (!s) return null;
    let neg = false;
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    // Le dernier séparateur (virgule ou point) suivi de 1-2 chiffres est décimal.
    const m = s.match(/^(\d{1,3}(?:[.,]?\d{3})*|\d+)(?:[.,](\d{1,2}))?$/);
    if (!m) return null;
    const whole = m[1].replace(/[.,]/g, '');
    const frac = (m[2] || '').padEnd(2, '0');
    const cents = Number(whole) * 100 + Number(frac);
    if (!Number.isSafeInteger(cents)) return null;
    return neg ? -cents : cents;
  }

  /** Format canadien-français : 1 234,56 $ (espaces fines insécables). */
  function formatMoney(cents, opts) {
    opts = opts || {};
    if (cents === null || cents === undefined) return '—';
    assertCents(cents);
    const neg = cents < 0, a = Math.abs(cents);
    const whole = Math.floor(a / 100), frac = a % 100;
    const w = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    let out = opts.noCents ? w : w + ',' + String(frac).padStart(2, '0');
    out += ' $';
    if (neg) out = '−' + out;
    else if (opts.sign && cents > 0) out = '+' + out;
    return out;
  }

  /** Ratio en points de base (ex. 2500 = 25,00 %). null si dénominateur nul. */
  function ratioBps(num, den) {
    if (!den) return null;
    return divRound(num * 10000, den);
  }
  function formatBps(bps, digits) {
    if (bps === null || bps === undefined) return '—';
    const d = digits === undefined ? 1 : digits;
    const v = bps / 100; // affichage uniquement
    return v.toLocaleString('fr-CA', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' %';
  }

  /* ============================ TAXES QUÉBEC ============================ */

  // TVQ = 9,975 % ne tombe pas sur des points de base entiers : on stocke en
  // millièmes de pour cent (1 % = 1000).
  const TAX_DEFAULTS = { tpsMilli: 5000, tvqMilli: 9975 };
  function salesTaxes(baseCents, rates) {
    const r = rates || TAX_DEFAULTS;
    const tps = divRound(baseCents * r.tpsMilli, 100000);
    const tvq = divRound(baseCents * r.tvqMilli, 100000);
    return { base: baseCents, tps, tvq, total: baseCents + tps + tvq };
  }

  /* =============================== DATES =============================== */

  const DAY_MS = 86400000;
  function isISODate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toISO(dayNum(s)) === s; }
  function dayNum(iso) {
    const y = +iso.slice(0, 4), m = +iso.slice(5, 7), d = +iso.slice(8, 10);
    return Math.round(Date.UTC(y, m - 1, d) / DAY_MS);
  }
  function toISO(n) {
    const dt = new Date(n * DAY_MS);
    return dt.getUTCFullYear().toString().padStart(4, '0') + '-' +
      String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
  }
  function addDays(iso, k) { return toISO(dayNum(iso) + k); }
  function diffDays(a, b) { return dayNum(b) - dayNum(a); }
  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, m) { return [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; }
  function ym(iso) { return iso.slice(0, 7); }
  function monthRange(ymStr) {
    const y = +ymStr.slice(0, 4), m = +ymStr.slice(5, 7);
    return { from: ymStr + '-01', to: ymStr + '-' + String(daysInMonth(y, m)).padStart(2, '0') };
  }
  function addMonthsYM(ymStr, k) {
    let y = +ymStr.slice(0, 4), m = +ymStr.slice(5, 7) - 1 + k;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return String(y).padStart(4, '0') + '-' + String(m + 1).padStart(2, '0');
  }
  /** Date du jour dans un fuseau donné (par défaut America/Toronto = Montréal). */
  function todayISO(tz, now) {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' });
    return f.format(now || new Date());
  }
  function clampDay(y, m, d) { return Math.min(d, daysInMonth(y, m)); }
  function dateOf(y, m, d) { return String(y).padStart(4, '0') + '-' + String(m).padStart(2, '0') + '-' + String(clampDay(y, m, d)).padStart(2, '0'); }
  function inRange(iso, from, to) { return (!from || iso >= from) && (!to || iso <= to); }

  /* ============================ FRÉQUENCES ============================= */

  const FREQUENCIES = {
    weekly: 'Chaque semaine',
    biweekly: 'Toutes les deux semaines',
    semimonthly: 'Deux fois par mois',
    monthly: 'Une fois par mois',
    quarterly: 'Tous les trois mois',
    yearly: 'Une fois par an',
    occasional: 'Occasionnel',
  };

  /**
   * Toutes les occurrences d'une règle entre from et to (inclus).
   * rule: { frequency, startDate, endDate?, day1?, day2? }
   *  - weekly / biweekly : tous les 7 / 14 jours à partir de startDate (jamais "deux fois par mois").
   *  - semimonthly : day1 et day2 de chaque mois (day2 = 31 => dernier jour du mois).
   *  - monthly / quarterly / yearly : même jour que startDate (ou day1), ramené au
   *    dernier jour si le mois est plus court (31 -> 30, 29 févr. -> 28 févr.).
   */
  function occurrences(rule, from, to) {
    const out = [];
    if (!rule || !rule.startDate || !isISODate(rule.startDate)) return out;
    const start = rule.startDate;
    const lo = from > start ? from : start;
    const hi = rule.endDate && rule.endDate < to ? rule.endDate : to;
    if (lo > hi) return out;
    const f = rule.frequency;
    if (f === 'weekly' || f === 'biweekly') {
      const step = f === 'weekly' ? 7 : 14;
      const s = dayNum(start), a = dayNum(lo), b = dayNum(hi);
      let k = Math.ceil((a - s) / step);
      if (k < 0) k = 0;
      for (let n = s + k * step; n <= b; n += step) out.push(toISO(n));
      return out;
    }
    if (f === 'semimonthly') {
      const d1 = rule.day1 || 15, d2 = rule.day2 || 31;
      let cur = ym(lo);
      const last = ym(hi);
      while (cur <= last) {
        const y = +cur.slice(0, 4), m = +cur.slice(5, 7);
        const days = [dateOf(y, m, d1), dateOf(y, m, d2)].sort();
        for (const d of days) if (d >= lo && d <= hi && d >= start && !out.includes(d)) out.push(d);
        cur = addMonthsYM(cur, 1);
      }
      return out;
    }
    if (f === 'monthly' || f === 'quarterly' || f === 'yearly') {
      const step = f === 'monthly' ? 1 : f === 'quarterly' ? 3 : 12;
      const day = rule.day1 || +start.slice(8, 10);
      let cur = ym(start), i = 0;
      // saute directement près de "lo"
      const gap = (+lo.slice(0, 4) - +start.slice(0, 4)) * 12 + (+lo.slice(5, 7) - +start.slice(5, 7));
      if (gap > step) { i = Math.floor((gap - 1) / step); cur = addMonthsYM(ym(start), i * step); }
      for (let guard = 0; guard < 2000; guard++) {
        const y = +cur.slice(0, 4), m = +cur.slice(5, 7);
        const d = dateOf(y, m, day);
        if (d > hi) break;
        if (d >= lo && d >= start) out.push(d);
        cur = addMonthsYM(cur, step);
      }
      return out;
    }
    return out; // occasional : aucune occurrence prévue
  }

  /* ========================= PÉRIODES DE PAIE ========================== */

  /** Période de 14 jours contenant `iso`, ancrée sur `anchor` (un jour de paie). */
  function payPeriodFor(iso, anchor) {
    const idx = Math.floor((dayNum(iso) - dayNum(anchor)) / 14);
    return payPeriodByIndex(idx, anchor);
  }
  function payPeriodByIndex(idx, anchor) {
    const start = addDays(anchor, idx * 14);
    return { index: idx, start, end: addDays(start, 13), id: 'P' + start };
  }

  /* ============================ CATÉGORIES ============================= */
  // kind: 'expense' (dépense), 'savings' (compte comme épargne, pas comme dépense),
  //       'transfer' (paiement de carte : les achats sont déjà comptés -> neutre)
  const DEFAULT_CATEGORIES = (function () {
    const groups = [
      ['logement', 'Logement', [['loyer', 'Hypothèque ou loyer'], ['copro', 'Frais de copropriété'], ['hydro', 'Électricité Hydro-Québec'], ['chauffage', 'Chauffage'], ['internet', 'Internet'], ['entretien_maison', 'Entretien'], ['reparations', 'Réparations']]],
      ['transport', 'Transport', [['auto_paiement', 'Paiement automobile'], ['essence', 'Essence'], ['assurance_auto', 'Assurance automobile'], ['stationnement', 'Stationnement'], ['entretien_auto', 'Entretien automobile'], ['pneus', 'Pneus'], ['transport_commun', 'Transport en commun'], ['uber', 'Uber et taxis']]],
      ['alimentation', 'Alimentation', [['epicerie', 'Épicerie'], ['restaurants', 'Restaurants'], ['livraison', 'Livraison'], ['cafe', 'Café'], ['depanneur', 'Dépanneur']]],
      ['quotidien', 'Vie quotidienne', [['pharmacie', 'Pharmacie'], ['vetements', 'Vêtements'], ['coiffeur', 'Coiffeur'], ['menage', 'Produits ménagers'], ['soins', 'Soins personnels'], ['loisirs', 'Loisirs'], ['sorties', 'Sorties']]],
      ['abonnements', 'Abonnements', [['netflix', 'Netflix'], ['spotify', 'Spotify'], ['apple', 'Apple'], ['telephone', 'Téléphone'], ['applications', 'Applications'], ['abonnements_autres', 'Autres abonnements']]],
      ['finances', 'Finances', [['carte_credit', 'Paiement de cartes de crédit', 'transfer'], ['prets', 'Prêts'], ['frais_bancaires', 'Frais bancaires'], ['interets', 'Intérêts'], ['investissements', 'Investissements', 'savings'], ['epargne', 'Épargne', 'savings']]],
      ['voyages', 'Voyages', [['avion', 'Billets d’avion'], ['hotels', 'Hôtels'], ['voyage_restaurants', 'Restaurants (voyage)'], ['voyage_transport', 'Transport (voyage)'], ['etranger', 'Dépenses à l’étranger']]],
      ['autres', 'Autres', [['cadeaux', 'Cadeaux'], ['imprevues', 'Dépenses imprévues'], ['urgences', 'Urgences'], ['autres_depenses', 'Autres dépenses']]],
    ];
    const out = [];
    for (const [gid, gname, items] of groups)
      for (const [id, name, kind] of items) out.push({ id, group: gid, groupName: gname, name, kind: kind || 'expense' });
    return out;
  })();
  const GROUPS = (function () {
    const seen = {}, out = [];
    for (const c of DEFAULT_CATEGORIES) if (!seen[c.group]) { seen[c.group] = 1; out.push({ id: c.group, name: c.groupName }); }
    return out;
  })();
  function categoryMap(custom) {
    const map = {};
    for (const c of DEFAULT_CATEGORIES) map[c.id] = c;
    for (const c of custom || []) map[c.id] = Object.assign({ kind: 'expense' }, c);
    return map;
  }

  /* ========================= CLASSIFICATION =========================== */

  /**
   * Effet d'une transaction sur les totaux. Une transaction n'est comptée
   * qu'une seule fois, dans une seule rubrique.
   *   income  : revenu net reçu
   *   expense : dépense (les remboursements la réduisent)
   *   savings : argent mis de côté (dépôts - retraits)
   *   neutral : transferts internes et paiements de carte (aucun effet)
   */
  function classify(tx, cats) {
    const r = { income: 0, expense: 0, savings: 0 };
    if (!tx || tx.status === 'cancelled') return r;
    const a = tx.amountCents;
    assertCents(a, 'amountCents');
    if (a < 0) throw new RangeError('Les montants sont toujours positifs ; utilisez le type « remboursement » ou « retrait ».');
    switch (tx.type) {
      case 'income': r.income = a; break;
      case 'expense': {
        const c = cats && cats[tx.categoryId];
        const kind = c ? c.kind : 'expense';
        if (kind === 'savings') r.savings = a;
        else if (kind === 'transfer') { /* neutre */ }
        else r.expense = a;
        break;
      }
      case 'refund': r.expense = -a; break;
      case 'savings': r.savings = tx.direction === 'withdraw' ? -a : a; break;
      case 'transfer': break;
      default: break;
    }
    return r;
  }

  function matches(tx, f) {
    if (!f) return true;
    if (f.from && tx.date < f.from) return false;
    if (f.to && tx.date > f.to) return false;
    if (f.person && tx.person !== f.person) return false;
    if (f.shared !== undefined && !!tx.shared !== f.shared) return false;
    if (f.categoryId && tx.categoryId !== f.categoryId) return false;
    if (f.group && !(f.cats && f.cats[tx.categoryId] && f.cats[tx.categoryId].group === f.group)) return false;
    if (f.type && tx.type !== f.type) return false;
    return true;
  }

  /** Totaux sur un ensemble de transactions (déduplication par id). */
  function totals(txs, cats, filter) {
    const t = { income: 0, expenses: 0, savings: 0, count: 0, byCategory: {}, byPerson: { khalil: { income: 0, expenses: 0, savings: 0 }, yousra: { income: 0, expenses: 0, savings: 0 } }, shared: 0, individual: 0 };
    const seen = new Set();
    const f = filter ? Object.assign({ cats }, filter) : null;
    for (const tx of txs) {
      if (!tx || seen.has(tx.id)) continue;
      seen.add(tx.id);
      if (tx.status === 'cancelled') continue;
      if (f && !matches(tx, f)) continue;
      const r = classify(tx, cats);
      if (!r.income && !r.expense && !r.savings) continue;
      t.count++;
      t.income += r.income; t.expenses += r.expense; t.savings += r.savings;
      const p = t.byPerson[tx.person];
      if (p) { p.income += r.income; p.expenses += r.expense; p.savings += r.savings; }
      if (r.expense) {
        t.byCategory[tx.categoryId] = (t.byCategory[tx.categoryId] || 0) + r.expense;
        if (tx.shared) t.shared += r.expense; else t.individual += r.expense;
      }
    }
    t.net = t.income - t.expenses;                 // ce qui reste après dépenses
    t.afterSavings = t.income - t.expenses - t.savings; // ce qui reste après épargne
    t.savingsRateBps = ratioBps(t.savings, t.income);
    return t;
  }

  /**
   * Solde bancaire disponible (comptes courants regroupés).
   * Nécessite un solde de départ ; sinon `known: false` et aucun montant certain.
   */
  function balance(txs, cats, settings, asOf) {
    const s = settings || {};
    if (s.openingBalanceCents === null || s.openingBalanceCents === undefined || !s.openingBalanceDate)
      return { known: false, cents: null, reason: 'Solde de départ non configuré' };
    const t = totals(txs, cats, { from: addDays(s.openingBalanceDate, 1), to: asOf });
    return { known: true, cents: s.openingBalanceCents + t.income - t.expenses - t.savings, since: s.openingBalanceDate };
  }

  /* ===================== REVENUS ATTENDUS / REÇUS ====================== */

  function sourceRule(src) {
    return { frequency: src.frequency, startDate: src.anchorDate, endDate: src.endDate, day1: src.day1, day2: src.day2 };
  }
  function expectedPays(sources, from, to) {
    const out = [];
    for (const s of sources || []) {
      if (s.active === false || s.frequency === 'occasional') continue;
      for (const d of occurrences(sourceRule(s), from, to))
        out.push({ sourceId: s.id, person: s.person, date: d, amountCents: s.netCents || 0, grossCents: s.grossCents || null, name: s.name });
    }
    return out.sort((a, b) => a.date < b.date ? -1 : 1);
  }
  /** Prochaine date de paie d'une source à partir de `from` (inclus). */
  function nextPayDate(src, from) {
    const o = occurrences(sourceRule(src), from, addDays(from, 400));
    return o[0] || null;
  }

  /**
   * Associe chaque paie attendue à une paie reçue (même source, ±3 jours,
   * chaque transaction utilisée une seule fois). Les paies attendues passées
   * sans correspondance sont « manquantes ».
   */
  function matchPays(expected, txs, today) {
    const used = new Set();
    const incomes = txs.filter(t => t.type === 'income' && t.status !== 'cancelled' && t.sourceId);
    return expected.map(e => {
      let best = null, bestGap = 99;
      for (const t of incomes) {
        if (used.has(t.id) || t.sourceId !== e.sourceId) continue;
        const g = Math.abs(diffDays(e.date, t.date));
        if (g <= 3 && g < bestGap) { best = t; bestGap = g; }
      }
      if (best) used.add(best.id);
      const status = best ? 'received' : (e.date < today ? 'missing' : 'expected');
      return Object.assign({}, e, { status, tx: best ? best.id : null, receivedCents: best ? best.amountCents : 0 });
    });
  }

  /* ======================== DÉPENSES RÉCURRENTES ======================= */

  /** Identifiant déterministe : une occurrence ne peut être enregistrée qu'une fois. */
  function recurringTxId(ruleId, date) { return 'r_' + ruleId + '_' + date; }

  function recurringOccurrences(rules, txs, from, to) {
    const ids = new Set(txs.filter(t => t.status !== 'cancelled').map(t => t.id));
    const out = [];
    for (const r of rules || []) {
      if (r.active === false) continue;
      for (const d of occurrences(r, from, to)) {
        const id = recurringTxId(r.id, d);
        out.push({ ruleId: r.id, date: d, amountCents: r.amountCents, kind: r.kind || 'expense', description: r.description, categoryId: r.categoryId, person: r.person, goalId: r.goalId, txId: id, paid: ids.has(id) });
      }
    }
    return out.sort((a, b) => a.date < b.date ? -1 : 1);
  }

  /** Transaction réelle créée à partir d'une occurrence (id déterministe). */
  function txFromOccurrence(rule, date) {
    const kind = rule.kind || 'expense';
    const tx = {
      id: recurringTxId(rule.id, date), date, amountCents: rule.amountCents, description: rule.description,
      person: rule.person || 'khalil', shared: !!rule.shared, method: rule.method || '', recurringId: rule.id, status: 'posted',
    };
    if (kind === 'savings') { tx.type = 'savings'; tx.direction = 'deposit'; tx.goalId = rule.goalId || null; }
    else if (kind === 'income') { tx.type = 'income'; }
    else { tx.type = 'expense'; tx.categoryId = rule.categoryId; }
    if (rule.debtId) tx.debtId = rule.debtId;
    if (rule.demo) tx.demo = true;
    return tx;
  }

  /* ========================= RÉSUMÉ D'UNE PÉRIODE ====================== */

  function periodSummary(period, data, today) {
    const { txs, cats, sources, recurring, settings } = data;
    const t = totals(txs, cats, { from: period.start, to: period.end });
    const exp = matchPays(expectedPays(sources, period.start, period.end), txs, today);
    const occ = recurringOccurrences(recurring, txs, period.start, period.end);
    const expectedIncome = exp.reduce((s, e) => s + e.amountCents, 0);
    const plannedExpenses = occ.filter(o => o.kind === 'expense').reduce((s, o) => s + o.amountCents, 0);
    const plannedSavings = occ.filter(o => o.kind === 'savings').reduce((s, o) => s + o.amountCents, 0)
      + ((settings && settings.plannedSavingsPerPeriodCents) || 0);
    const unpaidPlannedExpenses = occ.filter(o => o.kind === 'expense' && !o.paid && o.date >= (today < period.start ? period.start : today)).reduce((s, o) => s + o.amountCents, 0);
    const missing = exp.filter(e => e.status === 'missing');
    const pendingIncome = exp.filter(e => e.status !== 'received').reduce((s, e) => s + e.amountCents, 0);
    const savingsStillToSet = Math.max(0, plannedSavings - t.savings);
    // Reste à dépenser : uniquement avec l'argent réellement reçu.
    const leftToSpend = t.income - t.expenses - t.savings - savingsStillToSet - unpaidPlannedExpenses;
    return {
      period,
      expectedIncome, receivedIncome: t.income, pendingIncome,
      plannedExpenses, actualExpenses: t.expenses,
      plannedSavings, actualSavings: t.savings,
      remaining: t.income - t.expenses,                // montant restant
      afterSavings: t.income - t.expenses - t.savings, // disponible après épargne
      savingsRateBps: ratioBps(t.savings, t.income),
      leftToSpend, unpaidPlannedExpenses,
      pays: exp, occurrences: occ, missing,
      certain: missing.length === 0 && pendingIncome === 0,
      status: today < period.start ? 'future' : today > period.end ? 'past' : 'current',
      byPerson: t.byPerson, byCategory: t.byCategory,
    };
  }

  /* ============================== BUDGETS ============================== */

  function budgetLevel(pctBps) {
    if (pctBps === null) return 'none';
    if (pctBps >= 10000) return 'over';     // 100 % : dépassé
    if (pctBps >= 8500) return 'near';      // 85 % : presque atteint
    if (pctBps >= 7000) return 'watch';     // 70 % : à surveiller
    return 'ok';
  }
  function budgetStatus(budgets, txs, cats, ymStr) {
    const r = monthRange(ymStr);
    const t = totals(txs, cats, r);
    return (budgets || []).filter(b => b.limitCents > 0).map(b => {
      const spent = b.categoryId ? (t.byCategory[b.categoryId] || 0)
        : Object.keys(t.byCategory).filter(k => cats[k] && cats[k].group === b.group).reduce((s, k) => s + t.byCategory[k], 0);
      const pct = ratioBps(spent, b.limitCents);
      return { id: b.id, categoryId: b.categoryId, group: b.group, limit: b.limitCents, spent, remaining: b.limitCents - spent, pctBps: pct, level: budgetLevel(pct) };
    });
  }

  /* ============================== ÉPARGNE ============================== */

  function goalProgress(goal, txs, today) {
    let bal = goal.initialCents || 0;
    const seen = new Set();
    for (const t of txs) {
      if (seen.has(t.id)) continue; seen.add(t.id);
      if (t.status === 'cancelled' || t.type !== 'savings' || t.goalId !== goal.id) continue;
      bal += t.direction === 'withdraw' ? -t.amountCents : t.amountCents;
    }
    const remaining = Math.max(0, (goal.targetCents || 0) - bal);
    const pct = goal.targetCents ? Math.min(10000, Math.max(0, ratioBps(bal, goal.targetCents))) : null;
    let perMonth = null, monthsLeft = null;
    if (goal.targetDate && remaining > 0 && today) {
      const days = diffDays(today, goal.targetDate);
      monthsLeft = Math.max(1, Math.ceil(days / 30.4375));
      perMonth = days <= 0 ? remaining : divRound(remaining, monthsLeft);
    }
    return { id: goal.id, balance: bal, remaining, pctBps: pct, perMonthNeeded: perMonth, monthsLeft, reached: goal.targetCents ? bal >= goal.targetCents : false };
  }

  /** Épargne nette moyenne par mois sur les N derniers mois complets. */
  function savingsPace(txs, cats, today, months) {
    const n = months || 3;
    const cur = ym(today);
    let sum = 0;
    for (let i = 1; i <= n; i++) sum += totals(txs, cats, monthRange(addMonthsYM(cur, -i))).savings;
    return divRound(sum, n);
  }

  /* ============================== DETTES =============================== */

  /** Solde estimé : solde déclaré moins les paiements enregistrés depuis. */
  function debtBalance(debt, txs) {
    let paid = 0;
    for (const t of txs) if (t.status !== 'cancelled' && t.debtId === debt.id && t.date > (debt.asOfDate || '0000-00-00') && (t.type === 'expense' || t.type === 'transfer')) paid += t.amountCents;
    return Math.max(0, debt.balanceCents - paid);
  }
  /**
   * Simulation mensuelle : intérêts = solde × taux annuel ÷ 12 (arrondi au cent).
   * Retourne null si le paiement ne couvre pas les intérêts.
   */
  function debtPayoff(balanceCents, aprBps, paymentCents, startISO) {
    if (balanceCents <= 0) return { months: 0, totalInterest: 0, date: startISO };
    if (!paymentCents || paymentCents <= 0) return null;
    let bal = balanceCents, interest = 0, months = 0;
    while (bal > 0 && months < 600) {
      const i = divRound(bal * aprBps, 120000);
      if (paymentCents <= i) return null;
      interest += i;
      bal = bal + i - paymentCents;
      months++;
    }
    if (bal > 0) return null;
    const endYM = addMonthsYM(ym(startISO), months);
    return { months, totalInterest: interest, date: endYM };
  }

  /* ============================ PRÉVISIONS ============================= */

  const DEFAULT_SCENARIOS = {
    prudent: { label: 'Prudent', incomeAdjBps: -500, expenseAdjBps: 1000 },
    realiste: { label: 'Réaliste', incomeAdjBps: 0, expenseAdjBps: 0 },
    optimiste: { label: 'Optimiste', incomeAdjBps: 300, expenseAdjBps: -500 },
  };

  /** Dépenses variables moyennes par mois (hors récurrentes), N derniers mois complets. */
  function variableMonthlyAverage(txs, cats, today, months) {
    const n = months || 3;
    const cur = ym(today);
    let sum = 0, withData = 0;
    for (let i = 1; i <= n; i++) {
      const r = monthRange(addMonthsYM(cur, -i));
      const t = totals(txs.filter(x => !x.recurringId), cats, r);
      sum += t.expenses;
      if (t.count) withData++;
    }
    return { cents: withData ? divRound(sum, withData) : null, months: withData };
  }

  /**
   * Projection sur 12 mois à partir de demain : paies attendues réelles,
   * dépenses récurrentes non encore payées, dépenses variables moyennes.
   */
  function forecast(data, today, scenario, opts) {
    const { txs, cats, sources, recurring, settings, goals } = data;
    const sc = scenario || DEFAULT_SCENARIOS.realiste;
    const o = opts || {};
    const from = addDays(today, 1), to = addDays(today, 365);
    const variable = o.variableMonthlyCents !== undefined && o.variableMonthlyCents !== null
      ? { cents: o.variableMonthlyCents, months: -1 } : variableMonthlyAverage(txs, cats, today, 3);
    const pays = expectedPays(sources, from, to);
    const occ = recurringOccurrences(recurring, txs, from, to).filter(x => !x.paid);
    const bal = balance(txs, cats, settings, today);
    const rows = [];
    let cumulative = 0, cumSavings = 0;
    for (let i = 0; i <= 12; i++) {
      const m = addMonthsYM(ym(from), i);
      const r = monthRange(m);
      const lo = r.from < from ? from : r.from, hi = r.to > to ? to : r.to;
      if (lo > hi) continue;
      const covered = diffDays(lo, hi) + 1, dim = diffDays(r.from, r.to) + 1;
      const incBase = pays.filter(p => p.date >= lo && p.date <= hi).reduce((s, p) => s + p.amountCents, 0)
        + occ.filter(x => x.kind === 'income' && x.date >= lo && x.date <= hi).reduce((s, x) => s + x.amountCents, 0);
      const recExp = occ.filter(x => x.kind === 'expense' && x.date >= lo && x.date <= hi).reduce((s, x) => s + x.amountCents, 0);
      const recSav = occ.filter(x => x.kind === 'savings' && x.date >= lo && x.date <= hi).reduce((s, x) => s + x.amountCents, 0);
      const varExp = variable.cents ? divRound(variable.cents * covered, dim) : 0;
      const income = incBase + mulBps(incBase, sc.incomeAdjBps);
      const expBase = recExp + varExp;
      const expenses = expBase + mulBps(expBase, sc.expenseAdjBps);
      const net = income - expenses;
      cumulative += net; cumSavings += recSav;
      rows.push({ month: m, partial: covered < dim, income, expenses, recurringExpenses: recExp, variableExpenses: varExp, plannedSavings: recSav, net, cumulative, balance: bal.known ? bal.cents + cumulative : null });
    }
    const sum = k => rows.reduce((s, r) => s + r[k], 0);
    const annual = { income: sum('income'), expenses: sum('expenses'), net: sum('net'), plannedSavings: sum('plannedSavings') };
    // Objectifs : le surplus annuel couvre-t-il ce qui reste à épargner ?
    const goalRows = (goals || []).map(g => {
      const p = goalProgress(g, txs, today);
      return { id: g.id, name: g.name, remaining: p.remaining, balance: p.balance, target: g.targetCents };
    });
    const remainingGoals = goalRows.reduce((s, g) => s + g.remaining, 0);
    return {
      scenario: sc, from, to, rows, annual,
      startBalance: bal, endBalance: bal.known ? bal.cents + annual.net : null,
      variable, goals: goalRows, remainingGoals,
      goalsCoveredBps: remainingGoals ? Math.min(10000, Math.max(0, ratioBps(Math.max(0, annual.net), remainingGoals))) : 10000,
      incomplete: !(sources || []).some(s => s.active !== false && s.frequency !== 'occasional') || variable.cents === null,
    };
  }

  /* ============================ SÉRIES (graph.) ======================== */

  /** Séries revenus / dépenses / épargne par jour, période de paie, mois ou année. */
  function series(txs, cats, mode, today, anchor) {
    const buckets = [];
    if (mode === 'day') {
      for (let i = 29; i >= 0; i--) { const d = addDays(today, -i); buckets.push({ key: d, from: d, to: d }); }
    } else if (mode === 'period') {
      const cur = payPeriodFor(today, anchor || today);
      for (let i = 7; i >= 0; i--) { const p = payPeriodByIndex(cur.index - i, anchor || today); buckets.push({ key: p.start, from: p.start, to: p.end }); }
    } else if (mode === 'year') {
      const y = +today.slice(0, 4);
      for (let i = 2; i >= 0; i--) buckets.push({ key: String(y - i), from: (y - i) + '-01-01', to: (y - i) + '-12-31' });
    } else {
      for (let i = 11; i >= 0; i--) { const m = addMonthsYM(ym(today), -i); const r = monthRange(m); buckets.push({ key: m, from: r.from, to: r.to }); }
    }
    return buckets.map(b => { const t = totals(txs, cats, { from: b.from, to: b.to }); return { key: b.key, from: b.from, to: b.to, income: t.income, expenses: t.expenses, savings: t.savings }; });
  }

  /** Comparaison mois en cours (à date) vs même portion du mois précédent. */
  function monthToDateComparison(txs, cats, today) {
    const cur = monthRange(ym(today));
    const prevYM = addMonthsYM(ym(today), -1);
    const pr = monthRange(prevYM);
    const day = +today.slice(8, 10);
    const pdim = +pr.to.slice(8, 10);
    const prevTo = prevYM + '-' + String(Math.min(day, pdim)).padStart(2, '0');
    const a = totals(txs, cats, { from: cur.from, to: today });
    const b = totals(txs, cats, { from: pr.from, to: prevTo });
    const delta = (x, y) => ({ now: x, before: y, diff: x - y, pctBps: y ? ratioBps(x - y, y) : null });
    return { income: delta(a.income, b.income), expenses: delta(a.expenses, b.expenses), savings: delta(a.savings, b.savings) };
  }

  /* ============================ VALIDATION ============================= */

  function validateTx(tx, cats) {
    const e = {};
    if (!['income', 'expense', 'refund', 'savings', 'transfer'].includes(tx.type)) e.type = 'Type inconnu';
    if (!Number.isSafeInteger(tx.amountCents) || tx.amountCents <= 0) e.amount = 'Entrez un montant supérieur à 0';
    if (!isISODate(tx.date)) e.date = 'Date invalide';
    if (!['khalil', 'yousra'].includes(tx.person)) e.person = 'Choisissez Khalil ou Yousra';
    if ((tx.type === 'expense' || tx.type === 'refund') && !(cats && cats[tx.categoryId])) e.category = 'Choisissez une catégorie';
    if (tx.type === 'savings' && !tx.goalId) e.goal = 'Choisissez un compte d’épargne';
    if (tx.type === 'savings' && !['deposit', 'withdraw'].includes(tx.direction)) e.direction = 'Dépôt ou retrait ?';
    if (tx.type === 'transfer' && (!tx.fromAccount || !tx.toAccount || tx.fromAccount === tx.toAccount)) e.accounts = 'Choisissez deux comptes différents';
    return e;
  }

<script>/*

    ['transport_commun', /\b(stm|opus|autobus|bus|rem|exo|transport en commun)\b/],

    ['hydro', /\b(hydro|hydro-quebec|electricite)\b/],
    ['chauffage', /\b(chauffage|mazout|energir|gaz naturel)\b/],
    ['internet', /\b(internet|videotron|wifi)\b/],
    ['telephone', /\b(telephone|cellulaire|cell|forfait|fizz|koodo|virgin|fido|telus|rogers|bell)\b/],
    ['netflix', /\b(netflix)\b/],
    ['spotify', /\b(spotify)\b/],
    ['apple', /\b(apple|icloud|app store)\b/],
    ['applications', /\b(application|app|abonnement app)\b/],
    ['abonnements_autres', /\b(abonnement|disney\+?|crave|prime video|youtube premium|gym|ecofitness|energie cardio)\b/],
    ['pharmacie', /\b(pharmacie|pharmaprix|jean coutu|jean-coutu|familiprix|uniprix|proxim|medicament)\b/],

  function extractAmount(raw) {

    if (m) return { cents: K.parseMoney(m[1] + ',' + m[2]), span: [m.index, m.index + m[0].length] };

  /* ----------------------------- Date ----------------------------- */
  function extractDate(raw, today) {

    let m;
    if ((m = raw.match(/\b(\d{4})-(\d{2})-(\d{2})\b/)) && K.isISODate(m[0])) return { date: m[0], words: [m[0]] };
    if (/\bavant[- ]hier\b/.test(n)) return { date: K.addDays(today, -2), words: ['avant-hier', 'avant hier'] };
    if (/\bhier\b/.test(n)) return { date: K.addDays(today, -1), words: ['hier'] };
    if (/\b(aujourd'hui|aujourdhui|ce matin|ce midi|ce soir|tantot)\b/.test(n)) return { date: today, words: [] };
    if ((m = n.match(/\b(dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)( (dernier|passe))?\b/))) {
      const target = WEEKDAYS[m[1]];
      const dow = new Date(K.dayNum(today) * 86400000).getUTCDay();
      let back = (dow - target + 7) % 7; if (back === 0) back = 7;

      if (!g && tx.person) g = goals.find(x => x.owner === tx.person && /\b(mon|ma|perso|personnelle?)\b/.test(n));

      tx.fromAccount = 'Compte ' + (tx.person === 'khalil' ? 'Khalil' : 'Yousra');
      tx.toAccount = /\bcommun\b/.test(n) ? 'Compte commun' : 'Compte ' + (other === 'khalil' ? 'Khalil' : 'Yousra');

      .replace(/^\s*(j'ai|j’ai|on a|nous avons|khalil a|yousra a)\s+(payé|paye|dépensé|depense|acheté|achete|mis|reçu|recu)\s*/i, '')

    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 500 + Math.random() * 600)); return fn(); }
    throw e;
  }
}
function writeError(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' && !S.isOwner) { S.canWrite = false; schedule(); return 'Modification refusée : seul le propriétaire du compte peut modifier ces données.'; }
  if (c === 'quota_exceeded') return 'Espace de stockage plein : supprimez d’anciennes données (par exemple la démo) puis réessayez.';
  if (c === 'revoked' || c === 'not_granted') return 'Accès retiré à la base de données. Rechargez la page.';
  return 'Enregistrement impossible pour le moment. Vérifiez la connexion et réessayez.';
}
async function save(col, obj) {
  if (!S.canWrite) { toast('Lecture seule : modification impossible.'); throw new Error('ro'); }
  obj = clean(obj);
  if (S.mode === 'memory' || S.mode === 'local') { const a = S[col], i = a.findIndex(x => x.id === obj.id); if (i >= 0) a[i] = obj; else a.push(obj); persistLocal(); schedule(); return; }
  return enqueue(col + '/' + obj.id, () => withRetry(() => db.collection(col).doc(obj.id).set(obj))).catch(e => { toast(writeError(e)); throw e; });
}
async function removeDoc(col, id) {
  if (!S.canWrite) { toast('Lecture seule : suppression impossible.'); throw new Error('ro'); }
  if (S.mode === 'memory' || S.mode === 'local') { S[col] = S[col].filter(x => x.id !== id); persistLocal(); schedule(); return; }
  return enqueue(col + '/' + id, () => withRetry(() => db.collection(col).doc(id).delete())).catch(e => { toast(writeError(e)); throw e; });
}
async function saveSettings(patch) {
  const next = clean(Object.assign({}, S.settings, patch));
  Object.keys(next).forEach(k => { if (next[k] === null) delete next[k]; });
  if (S.mode === 'memory' || S.mode === 'local') { S.settings = next; persistLocal(); schedule(); return; }
  if (!S.canWrite) { toast('Lecture seule.'); return; }
  S.settings = next; schedule();
  return enqueue('config/settings', () => withRetry(() => db.doc('config/settings').set(next))).catch(e => toast(writeError(e)));
}
async function pool(items, n, fn, onProgress) {
  let i = 0, done = 0;
  const run = async () => { while (i < items.length) { const it = items[i++]; await fn(it); done++; onProgress && onProgress(done, items.length); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, run));
}

/* ============================== Graphiques ============================== */
function niceStep(max, n) {
  const raw = max / n; const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
  return 10 * p;
}
/** Barres groupées (cents). rows: [{label, values:[..]}], colors: tokens */
function barChart(rows, keys, opts) {
  opts = opts || {};
  const W = 720, H = opts.h || 250, pl = 52, pr = 10, pt = 14, pb = 30;
  let max = 0, min = 0;
  rows.forEach(r => keys.forEach(k => { max = Math.max(max, r[k.key]); min = Math.min(min, r[k.key]); }));
  if (max === 0 && min === 0) max = 100000;
  const step = niceStep((max - min) / 100, 4) * 100;
  const top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
  const y = v => pt + (top - v) / (top - bot) * (H - pt - pb);
  const gw = (W - pl - pr) / rows.length;
  const bw = Math.max(2, Math.min(16, gw * 0.72 / keys.length));
  let g = '';
  for (let v = bot; v <= top + 1; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`;
  const every = Math.ceil(rows.length / 12);
  rows.forEach((r, i) => {
    const x0 = pl + i * gw + (gw - bw * keys.length - 2 * (keys.length - 1)) / 2;
    keys.forEach((k, j) => {
      const v = r[k.key], yy = y(Math.max(v, 0)), hh = Math.abs(y(v) - y(0));
      g += `<rect x="${(x0 + j * (bw + 2)).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(v ? 1 : 0, hh).toFixed(1)}" rx="${Math.min(3, bw / 2)}" fill="var(${k.color})"><title>${esc(r.label)} · ${k.label} : ${M(v)}</title></rect>`;
    });
    if (i % every === 0) g += `<text x="${(pl + i * gw + gw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${esc(r.short || r.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Graphique')}">${g}<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" /></svg></div>`;
}
function lineChart(rows, keys, opts) {
  opts = opts || {};
  const W = 720, H = opts.h || 230, pl = 56, pr = 14, pt = 14, pb = 30;
  let max = 0, min = 0;
  rows.forEach(r => keys.forEach(k => { if (r[k.key] !== null) { max = Math.max(max, r[k.key]); min = Math.min(min, r[k.key]); } }));
  if (max === min) max = min + 100000;
  const step = niceStep((max - min) / 100, 4) * 100;
  const top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
  const y = v => pt + (top - v) / (top - bot) * (H - pt - pb);
  const x = i => pl + (rows.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (rows.length - 1));
  let g = '';
  for (let v = bot; v <= top + 1; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v === 0 ? '--line' : '--line-2'})"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`;
  const every = Math.ceil(rows.length / 12);
  rows.forEach((r, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${esc(r.short || r.label)}</text>`; });
  keys.forEach(k => {
    const pts = rows.map((r, i) => r[k.key] === null ? null : [x(i), y(r[k.key])]).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (k.area) g += `<path d="${d} L${pts[pts.length - 1][0].toFixed(1)} ${y(Math.max(bot, 0))} L${pts[0][0].toFixed(1)} ${y(Math.max(bot, 0))} Z" fill="var(${k.color})" opacity=".12"/>`;
    g += `<path d="${d}" fill="none" stroke="var(${k.color})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${k.dash ? 'stroke-dasharray="5 5"' : ''}/>`;
    const last = pts[pts.length - 1];
    g += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--surface)" stroke="var(${k.color})" stroke-width="2.2"/>`;
    rows.forEach((r, i) => { if (r[k.key] !== null) g += `<circle cx="${x(i)}" cy="${y(r[k.key])}" r="9" fill="transparent"><title>${esc(r.label)} · ${k.label} : ${M(r[k.key])}</title></circle>`; });
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Graphique')}">${g}</svg></div>`;
}
function donut(segs, center) {
  const total = segs.reduce((s, x) => s + x.v, 0);
  const R = 70, c = 2 * Math.PI * R;
  let off = 0, g = '';
  if (!total) g = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="22"/>`;
  segs.forEach(s => {
    const len = s.v / total * c;
    g += `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 1.5).toFixed(2)} ${(c - len + 1.5).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(s.label)} : ${M(s.v)}</title></circle>`;
    off += len;
  });
  return `<div class="chart" style="max-width:220px;margin:auto"><svg viewBox="0 0 180 180">${g}<text x="90" y="86" text-anchor="middle" style="font-size:11px">${esc(center[0])}</text><text x="90" y="106" text-anchor="middle" style="font-size:17px;fill:var(--ink);font-weight:600">${esc(center[1])}</text></svg></div>`;
}

function upcoming(t, days) {
  const to = K.addDays(t, days), cats = C();
  const a = anchor(); const pstart = a ? K.payPeriodFor(t, a).start : t;
  const items = [];
  K.matchPays(K.expectedPays(S.sources, pstart, to), S.tx, t).forEach(p => { if (p.status !== 'received') items.push({ date: p.date, kind: 'pay', person: p.person, title: 'Paie ' + PEOPLE[p.person] + (p.name && p.name !== 'Salaire' ? ' · ' + p.name : ''), amount: p.amountCents, status: p.status, sourceId: p.sourceId }); });
  K.recurringOccurrences(S.recurring, S.tx, pstart, to).forEach(o => { if (!o.paid) items.push({ date: o.date, kind: o.kind === 'savings' ? 'save' : 'bill', title: o.description || catName(o.categoryId), amount: o.amountCents, ruleId: o.ruleId, late: o.date < t, person: o.person }); });
  S.events.forEach(e => K.occurrences({ frequency: e.frequency || 'once', startDate: e.date }, t, to).concat(!e.frequency || e.frequency === 'occasional' || e.frequency === 'once' ? (e.date >= t && e.date <= to ? [e.date] : []) : []).forEach(d => items.push({ date: d, kind: 'event', title: e.title, amount: e.amountCents || null, eventId: e.id })));
  debtDates(t, to).forEach(d => items.push(d));
  return items.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
}
function debtDates(from, to) {
  const linked = new Set(S.recurring.filter(r => r.debtId).map(r => r.debtId));
  const out = [];
  S.debts.forEach(d => {
    if (!d.paymentDay || linked.has(d.id) || K.debtBalance(d, S.tx) <= 0) return;
    K.occurrences({ frequency: 'monthly', startDate: '2000-01-01', day1: d.paymentDay }, from, to).forEach(x => out.push({ date: x, kind: 'debt', title: 'Paiement · ' + d.name, amount: d.plannedPaymentCents || d.minPaymentCents, debtId: d.id }));
  });
  return out;
}

function smartPreview() {
  const text = UI.smart.trim();
  if (!text) return `<div class="smart-ex"><span class="small muted">Exemples :</span>${SMART_EX.map(e => `<button type="button" class="chip" data-act="smart-ex" data-v="${esc(e)}">${esc(e)}</button>`).join('')}</div>`;
  const rs = NLP.parseText(text, nlpCtx());
  return `<div class="list smart-list">${rs.map(smartRow).join('')}</div>
  <div class="small muted" style="margin-top:8px">${rs.length > 1 ? rs.length + ' éléments · ' : ''}Entrée pour ajouter · <span class="kbd">Maj + Entrée</span> pour une autre ligne · ✎ pour ajuster</div>`;
}
function refreshSmart() {
  const prev = $('#smart-prev'), go = $('#smart-go'); if (!prev) return;
  prev.innerHTML = smartPreview();
  const rs = UI.smart.trim() ? NLP.parseText(UI.smart, nlpCtx()) : [];
  const n = rs.filter(r => r.ok).length, src = rs.filter(r => r.kind === 'source').length;
  go.disabled = !n && !src;
  go.textContent = n > 1 ? 'Ajouter ' + n : n ? 'Ajouter' : src ? 'Compléter' : 'Ajouter';
}
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }
function bindSmart() {
  const el = $('#smart-in'); if (!el) return;
  autosize(el); refreshSmart();
  el.addEventListener('input', () => { UI.smart = el.value; UI.smartDupOk = false; autosize(el); refreshSmart(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); smartSubmit(); } });
  $('#smart-form').addEventListener('submit', e => { e.preventDefault(); smartSubmit(); });
}
function setSmart(results) {
  UI.smart = results.map(r => r.text).join('\n'); UI.smartDupOk = false;
  const el = $('#smart-in'); if (el) { el.value = UI.smart; autosize(el); }
  refreshSmart();
}
async function smartSubmit() {
  if (!S.canWrite) return toast('Lecture seule.');
  const rs = NLP.parseText(UI.smart, nlpCtx());
  const ok = rs.filter(r => r.ok), sources = rs.filter(r => r.kind === 'source'), rest = rs.filter(r => !r.ok && r.kind !== 'source');
  if (!ok.length && !sources.length) { toast(rs.length ? 'Il manque le montant : écrivez-le avec le texte (ex. « 12,50 »).' : 'Écrivez une transaction.'); return; }
  if (!UI.smartDupOk && ok.some(isDup)) { UI.smartDupOk = true; toast('Doublon possible : appuyez encore sur Entrée pour ajouter quand même.'); return; }
  const done = [];
  try {
    for (const r of ok) {
      if (r.kind === 'rule') {
        const rule = Object.assign({ id: uid('r'), active: true, createdAt: Date.now(), source: 'texte' }, r.rule);
        await save('recurring', rule); done.push(['recurring', rule.id, (rule.description || catName(rule.categoryId)) + ' · ' + FREQ_SHORT[rule.frequency].toLowerCase()]);
      } else {
        const tx = Object.assign({ id: uid('t'), createdAt: Date.now(), updatedAt: Date.now(), updatedBy: S.me, source: 'texte' }, r.tx);
        await save('tx', tx); done.push(['tx', tx.id, txLabel(tx) + ' · ' + K.formatMoney(tx.amountCents)]);
      }
    }
  } catch (e) { /* message déjà affiché */ }
  // Les sources de paie s'ouvrent dans leur formulaire, une à la fois
  const nextSrc = sources[0];
  setSmart(sources.slice(1).concat(rest));
  if (done.length) toast(done.length === 1 ? 'Ajouté : ' + done[0][2] : done.length + ' éléments ajoutés', async () => { for (const [c, id] of done) await removeDoc(c, id).catch(() => {}); toast('Annulé'); });
  if (nextSrc) openSourceFromText(nextSrc);
  else { const el = $('#smart-in'); if (el) el.focus(); }
  schedule();
}
function openSourceFromText(r) {
  const preset = Object.assign({}, r.source); Object.keys(preset).forEach(k => preset[k] === null && delete preset[k]);
  openSource(r.existingId || null, r.source.person, preset);
}
function smartEdit(i) {
  const rs = NLP.parseText(UI.smart, nlpCtx()); const r = rs[i]; if (!r) return;
  setSmart(rs.filter((x, j) => j !== i));
  if (r.kind === 'source') return openSourceFromText(r);
  if (r.kind === 'rule') return openRecurring(null, r.rule);
  openTx({ type: r.tx.type, date: r.tx.date, preset: Object.assign({}, r.tx) });
}

/* =========================== Photo de reçu =========================== */
let ocrWorker = null, sampleImages = false;
async function prepImage(file, maxSide, gray) {
  const bmp = await createImageBitmap(file).catch(() => null);
  let img = bmp;
  if (!img) { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = img.width, h = img.height, k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  if (gray) {
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { let v = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]; v = Math.max(0, Math.min(255, (v - 128) * 1.5 + 140)); a[i] = a[i + 1] = a[i + 2] = v; }
    g.putImageData(d, 0, 0);
  }
  return c;
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function ocrLocal(file, onProgress) {
  if (!window.Tesseract) await loadScript('ocr/tesseract.min.js', 'Tesseract');
  if (!ocrWorker) {
    onProgress('Préparation de la lecture (une seule fois)…');
    ocrWorker = await window.Tesseract.createWorker('fra', 1, { workerPath: 'ocr/worker.min.js', corePath: 'ocr/', langPath: 'ocr', gzip: true, logger: m => { if (m.status === 'recognizing text') onProgress('Lecture du reçu… ' + Math.round(m.progress * 100) + ' %'); } });
    await ocrWorker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
  }
  const c = await prepImage(file, 2000, true);
  onProgress('Lecture du reçu…');
  const { data } = await ocrWorker.recognize(c);
  return NLP.parseReceipt(data.text, nlpCtx());
}
async function ocrClaude(file, onProgress) {
  onProgress('Claude lit le reçu…');
  const c = await prepImage(file, 1600, false);
  const blob = await canvasBlob(c, 'image/jpeg', 0.85);
  const catList = Object.values(C()).filter(x => x.kind === 'expense').map(x => x.id + ' = ' + x.name).join('; ');
  const j = await sampleFn.json(`Voici la photo d'un reçu d'achat (Québec). Lis-le attentivement et réponds UNIQUEMENT avec un objet JSON :
{"merchant": "nom du commerce", "total": "montant total payé, ex. 35.69", "subtotal": "ou null", "tps": "TPS/GST ou null", "tvq": "TVQ/QST ou null", "date": "AAAA-MM-JJ ou null", "method": "Carte de crédit | Débit | Comptant | null", "categoryId": "un identifiant de la liste", "unsure": ["ce qui est illisible ou incertain"]}
N'invente rien : mets null si une valeur n'est pas lisible. Le total est le montant final payé (taxes incluses, pourboire inclus s'il est ajouté au total). Aujourd'hui : ${today()}.
Catégories (identifiant = nom) : ${catList}`, { images: [blob], modelTier: 'default', cache: false });
  const money = v => v === null || v === undefined || v === '' ? null : K.parseMoney(String(v).replace('.', ','));
  const r = { merchant: j.merchant || null, totalCents: money(j.total), subtotalCents: money(j.subtotal), tpsCents: money(j.tps), tvqCents: money(j.tvq), date: K.isISODate(j.date) && j.date <= today() ? j.date : today(), method: ['Carte de crédit', 'Débit', 'Comptant'].includes(j.method) ? j.method : '', categoryId: C()[j.categoryId] ? j.categoryId : NLP.matchCategory(NLP.norm(j.merchant || ''), j.merchant || '', C()).id, warnings: [] };
  if (!K.isISODate(j.date)) r.warnings.push('Date du reçu non trouvée : aujourd’hui');
  if (!r.totalCents) r.warnings.push('Total non trouvé');
  (Array.isArray(j.unsure) ? j.unsure : []).slice(0, 3).forEach(u => r.warnings.push('À vérifier : ' + String(u)));
  return r;
}
async function handleReceipt(file) {
  if (!file) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name || '')) return toast('Choisissez une photo du reçu.');
  const useClaude = !!(sampleFn && sampleImages), useLocal = !!window.KFIS_STANDALONE;
  if (!useClaude && !useLocal) return toast('La lecture des reçus n’est pas disponible ici. Autorisez l’assistant Claude, ou utilisez le lien direct.');
  openModal('Lecture du reçu', `<div class="receipt-wait"><div class="spinner"></div><div id="ocr-msg">Ouverture de la photo…</div><div class="small muted">${useClaude ? 'La photo est envoyée à Claude pour lecture.' : 'La lecture se fait sur cet appareil : la photo n’est envoyée nulle part.'}</div></div>`, `<span class="grow"></span><button type="button" class="btn ghost" data-act="modal-close">Annuler</button>`, () => {});
  const ctl = modalCtx; const msg = t => { const e = $('#ocr-msg'); if (e) e.textContent = t; };
  let thumb = null;
  try { const tc = await prepImage(file, 360, false); thumb = tc.toDataURL('image/jpeg', 0.7); } catch (e) { /* aperçu facultatif */ }
  let r;
  try { r = useClaude ? await ocrClaude(file, msg) : await ocrLocal(file, msg); }
  catch (e) {
    if (modalCtx !== ctl) return;
    const code = e && e.code;
    if (code === 'not_granted' || code === 'images_unavailable' || code === 'sampling_disabled') sampleImages = false;
    msg(code === 'not_granted' ? 'Lecture refusée : autorisez Claude pour lire les reçus.' : code === 'invalid_json' ? 'Le reçu n’a pas pu être lu. Essayez une photo plus nette, à plat et bien éclairée.' : 'Lecture impossible. Essayez une photo plus nette, à plat et bien éclairée.');
    return;
  }
  if (modalCtx !== ctl) return; // annulé
  closeModal();
  const notes = ['Reçu' + (r.merchant ? ' ' + r.merchant : ''), r.subtotalCents ? 'sous-total ' + K.formatMoney(r.subtotalCents) : '', r.tpsCents !== null && r.tpsCents !== undefined ? 'TPS ' + K.formatMoney(r.tpsCents) : '', r.tvqCents !== null && r.tvqCents !== undefined ? 'TVQ ' + K.formatMoney(r.tvqCents) : ''].filter(Boolean).join(' · ');
  const shared = ['epicerie', 'loyer', 'hydro', 'internet', 'chauffage', 'menage'].includes(r.categoryId);
  openTx({ type: 'expense', date: r.date, receipt: { r, thumb, engine: useClaude ? 'claude' : 'local' }, preset: { amountCents: r.totalCents || undefined, categoryId: r.categoryId, description: r.merchant || 'Reçu', method: r.method || '', notes, shared, source: 'recu' } });
}
document.addEventListener('change', e => { if (e.target.id === 'receipt-file' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; handleReceipt(f); } });

  const goals = S.goals.map(g => ({ g, p: K.goalProgress(g, S.tx, t) })).slice(0, 5);

      ${goals.length ? `<div class="grid" style="gap:14px">${goals.map(({ g, p }) => `<div><div style="display:flex;justify-content:space-between;gap:8px"><span class="t" style="font-weight:500">${esc(g.name)}</span><span class="tn small">${K.formatBps(p.pctBps, 0)}</span></div><div style="margin:6px 0 4px">${progress(p.pctBps)}</div><div class="small muted tn">${M(p.balance, { noCents: true })} sur ${M(g.targetCents, { noCents: true })}</div></div>`).join('')}</div>` : emptyState('Aucun objectif', 'Fonds d’urgence, voyage, maison…', `<button class="btn sm" data-act="goal-new">${ico('plus')}Créer un objectif</button>`)}</div>
    <div class="card"><div class="card-h"><h2 class="grow">Budgets du mois</h2><a class="btn ghost sm" href="#budgets">Tout voir</a></div>
      ${bs.length ? `<div class="grid" style="gap:14px">${bs.map(b => `<div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-weight:500">${esc(b.categoryId ? catName(b.categoryId) : b.group)}</span><span class="pill ${LEVEL[b.level][0]}">${K.formatBps(b.pctBps, 0)}</span></div><div style="margin:6px 0 4px">${progress(b.pctBps, b.level, [70, 85])}</div><div class="small muted tn">${M(b.spent, { noCents: true })} / ${M(b.limit, { noCents: true })} · reste ${M(b.remaining, { noCents: true })}</div></div>`).join('')}</div>` : emptyState('Aucun budget', 'Fixez une limite par catégorie.', `<button class="btn sm" data-act="budget-new">${ico('plus')}Créer un budget</button>`)}</div>

function upRow(u) {
  const kindIco = u.kind === 'pay' ? `<div class="ico in">${ico('income')}</div>` : u.kind === 'save' ? `<div class="ico sv">${ico('savings')}</div>` : u.kind === 'debt' ? `<div class="ico">${ico('debt')}</div>` : u.kind === 'event' ? `<div class="ico">${ico('calendar')}</div>` : `<div class="ico">${ico('repeat')}</div>`;
  let action = '';
  if (u.kind === 'pay') action = `<button class="btn sm" data-act="pay-record" data-src="${esc(u.sourceId)}" data-date="${u.date}">Reçue</button>`;
  else if (u.ruleId) action = `<button class="btn sm" data-act="occ-pay" data-rule="${esc(u.ruleId)}" data-date="${u.date}">${u.kind === 'save' ? 'Faite' : 'Payée'}</button>`;
  const status = u.status === 'missing' ? '<span class="pill neg">Manquante</span>' : u.late ? '<span class="pill near">En retard</span>' : '';
  return `<div class="row">${kindIco}<div class="grow"><div class="t">${esc(u.title)} ${status}</div><div class="s">${esc(cap(fmtD(u.date, 'wdm')))}${u.person && u.kind !== 'pay' ? '' : ''}</div></div><div class="amt">${u.amount !== null && u.amount !== undefined ? (u.kind === 'pay' ? `<span class="pos">${M(u.amount)}</span>` : M(u.amount)) : ''}</div>${action}</div>`;
}

/* ---------- 2. Transactions ---------- */
function filteredTx() {
  const f = UI.tx, q = f.q.trim().toLowerCase();
  return S.tx.filter(t => {
    if (!f.cancelled && t.status === 'cancelled') return false;
    if (f.type && t.type !== f.type) return false;
    if (f.person && t.person !== f.person) return false;
    if (f.cat && t.categoryId !== f.cat) return false;
    if (f.month && K.ym(t.date) !== f.month) return false;
    if (q) { const hay = (txLabel(t) + ' ' + txSub(t) + ' ' + (t.notes || '') + ' ' + (t.amountCents / 100).toFixed(2)).toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : (y.createdAt || 0) - (x.createdAt || 0));
}
function txListHTML() {
  const list = filteredTx(), cats = C();
  if (!list.length) return emptyState(S.tx.length ? 'Aucun résultat' : 'Aucune transaction', S.tx.length ? 'Modifiez la recherche ou les filtres.' : 'Utilisez « Ajouter une transaction ».');
  const tot = K.totals(list, cats);
  let h = `<div class="toolbar small muted" style="margin-bottom:6px"><span>${list.length} transaction${list.length > 1 ? 's' : ''}</span><span>Revenus <b class="pos tn">${M(tot.income)}</b></span><span>Dépenses <b class="tn">${M(tot.expenses)}</b></span><span>Épargne <b class="tn">${M(tot.savings)}</b></span></div>`;
  let cur = null, shown = 0;
  for (const t of list) {
    if (shown >= 400) { h += `<div class="empty small">Affichage limité aux 400 plus récentes : précisez la recherche.</div>`; break; }
    if (t.date !== cur) { cur = t.date; const dt = K.totals(list.filter(x => x.date === cur), cats); h += `<div class="day-h"><span>${esc(cap(fmtD(cur, 'wdm')))}</span><span class="tn">${dt.expenses ? '−' + M(dt.expenses) : ''}</span></div>`; }
    h += txRow(t); shown++;
  }
  return h;
}

/* ---------- 3. Revenus ---------- */

/* ---------- 4. Dépenses ---------- */

/* ---------- 5. Périodes de paie ---------- */

    </div>

/* ---------- 6. Budgets ---------- */

  const tot = st.reduce((a, b) => ({ limit: a.limit + b.limit, spent: a.spent + b.spent }), { limit: 0, spent: 0 });
  const totPct = K.ratioBps(tot.spent, tot.limit);
  const isCur = m === K.ym(t);
  const r = K.monthRange(m); const elapsed = isCur ? K.diffDays(r.from, t) + 1 : K.diffDays(r.from, r.to) + 1; const dim = K.diffDays(r.from, r.to) + 1;
  const pace = Math.round(elapsed / dim * 100);
  return `<div class="toolbar">${monthPicker('month-shift', m)}<div class="grow"></div><button class="btn pri" data-act="budget-new">${ico('plus')}Budget</button></div>
    <div class="grid g4 kpis">
      <div class="card kpi"><div class="k-l">Budget autorisé</div><div class="k-v">${M(tot.limit, { noCents: true })}</div><div class="k-s">${st.length} catégorie${st.length > 1 ? 's' : ''}</div></div>
